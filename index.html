<!DOCTYPE html>
<html lang="zh-CN" style="--topH: 506.1250305175781px;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的思维导图</title>
<style>
:root{
  --bg:#f6f8fb; --surface:#ffffff; --surface2:#eff4f9; --text:#12253b; --text2:#4a5b70;
  --muted:#7b8a9c; --line:#d3dfeb; --accent:#185fa5; --accent-deep:#0c447c;
  --accent-soft:#e6f1fb; --root:#0c447c; --root-text:#ffffff;
  --amber:#ba7517; --amber-soft:#faeeda; --amber-line:#ef9f27; --amber-text:#854f0b;
  --danger:#a32d2d; --shadow:0 1.3px 2.6px rgba(16,42,70,.06);
}
body[data-theme="dark"]{
  --bg:#0e1721; --surface:#172534; --surface2:#1e2f42; --text:#e9f0f7; --text2:#b6c5d4;
  --muted:#8799aa; --line:#32485e; --accent:#85b7eb; --accent-deep:#b5d4f4;
  --accent-soft:#1c3550; --root:#2f6fb5; --root-text:#ffffff;
  --amber:#fac775; --amber-soft:#372b16; --amber-line:#a06a15; --amber-text:#fac775;
  --danger:#f09595; --shadow:0 1.3px 2.6px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif);font-size:16.9px;line-height:1.6}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1.3px solid var(--line)}
.bar{display:flex;align-items:center;gap:18.2px;flex-wrap:wrap;padding:14.3px 28.6px 11.7px}
.brand{font-size:19.5px;font-weight:500;color:var(--accent-deep);white-space:nowrap;margin-right:2.6px}
.stat{font-size:14.3px;color:var(--muted);white-space:nowrap}
.tools{display:flex;align-items:center;gap:9.1px;flex-wrap:wrap;margin-left:auto}
.btn{height:40.3px;padding:0 14.3px;border:1.3px solid var(--line);border-radius:10.4px;background:var(--surface);color:var(--text2);font-size:15.6px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);color:var(--text2);border-color:var(--line)}
.search-wrap{display:flex;align-items:center;height:40.3px;border:1.3px solid var(--line);border-radius:10.4px;background:var(--surface);padding:0 6.5px 0 11.7px;gap:6.5px}
.search-wrap:focus-within{border-color:var(--accent)}
.search-wrap svg{flex:none;opacity:.55}
.search-wrap input{border:0;outline:0;background:transparent;width:205.4px;font-size:15.6px}
.search-wrap input::placeholder{color:var(--muted)}
.count{font-size:14.3px;color:var(--muted);min-width:39px;text-align:center}
.count.zero{color:var(--danger)}
.mini{width:28.6px;height:29.9px;border:0;border-radius:6.5px;background:var(--surface2);color:var(--text2);font-size:15.6px;line-height:1;padding:0}
.mini:hover{background:var(--accent-soft);color:var(--accent-deep)}
.zoom-group{display:flex;align-items:center;border:1.3px solid var(--line);border-radius:10.4px;background:var(--surface);overflow:hidden}
.zoom-group .mini{border-radius:0;height:37.7px;width:33.8px;background:transparent}
.zoom-group .mini:hover{background:var(--accent-soft)}
.zval{font-size:14.3px;color:var(--text2);min-width:54.6px;text-align:center}
.editbar{display:flex;align-items:center;gap:9.1px;flex-wrap:wrap;padding:11.7px 28.6px 10.4px;border-top:1.3px dashed var(--line)}
body:not(.edit-mode) .edit-only{display:none}
#htmlBtn{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
#htmlBtn:hover{background:var(--accent);color:#fff}
.edtag{font-size:14.3px;color:var(--amber-text);background:var(--amber-soft);border:1.3px solid var(--amber-line);border-radius:26px;padding:2.6px 13px;white-space:nowrap}
.eddiv{width:1.3px;height:23.4px;background:var(--line);margin:0 3.9px}
.save-state{font-size:14.3px;color:var(--muted);margin-left:auto;white-space:nowrap}
.save-state.bad{color:var(--danger)}
.steps{display:flex;align-items:center;gap:7.8px;padding:0 28.6px 13px;overflow-x:auto}
.step{display:flex;align-items:center;gap:9.1px;height:37.7px;padding:0 15.6px;border:1.3px solid var(--line);border-radius:26px;background:var(--surface);color:var(--text2);font-size:15.6px;white-space:nowrap}
.step:hover{border-color:var(--accent)}
.step.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.step i{font-style:normal;width:22.1px;height:22.1px;border-radius:50%;background:var(--surface2);color:var(--text2);font-size:14.3px;display:inline-flex;align-items:center;justify-content:center}
.step.active i{background:var(--accent);color:#fff}
.sep{width:18.2px;height:1.3px;background:var(--line);flex:none}
main{max-width:1680px;margin:0 auto;padding:33.8px 33.8px 52px}
.canvas{transform-origin:top left}
.axis{margin:23.4px 0 0 28.6px;padding-left:41.6px;border-left:2.6px solid var(--line)}
.b1{--bc:#185fa5;--bs:#e6f1fb;--bl:#b5d4f4}
.b2{--bc:#a32d2d;--bs:#fcebeb;--bl:#f7c1c1}
.b3{--bc:#3b6d11;--bs:#eaf3de;--bl:#c0dd97}
.b4{--bc:#534ab7;--bs:#eeedfe;--bl:#cecbf6}
body[data-theme="dark"] .b1{--bc:#85b7eb;--bs:#16293d;--bl:#2b4a6b}
body[data-theme="dark"] .b2{--bc:#f09595;--bs:#3a1d20;--bl:#6b3538}
body[data-theme="dark"] .b3{--bc:#97c459;--bs:#1f2e17;--bl:#405c28}
body[data-theme="dark"] .b4{--bc:#afa9ec;--bs:#241f42;--bl:#423a70}
.node{position:relative}
.branch{margin:0 0 28.6px;scroll-margin-top:calc(var(--topH, 220px) + 26px)}
.branch:before{content:"";position:absolute;left:-41.6px;top:27.3px;width:41.6px;border-top:2.6px solid var(--line)}
.node-head{display:flex;align-items:flex-start;gap:11.7px;padding:7.8px 13px;border-radius:11.7px;cursor:default;transition:background .15s,outline-color .15s}
.node-head:hover{background:var(--surface2)}
.branch>.node-head{background:var(--bs);border:1.3px solid var(--bl);padding:14.3px 18.2px;border-radius:14.3px;align-items:center}
.branch>.node-head:hover{filter:brightness(.98)}
.branch>.node-head .t{font-size:19.5px;color:var(--bc)}
.toggle{width:24.7px;height:24.7px;flex:none;margin-top:1.3px;border:1.3px solid var(--line);border-radius:6.5px;background:var(--surface);color:var(--text2);font-size:16.9px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.collapsed>.node-head .toggle{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.leaf-dot{width:9.1px;height:9.1px;flex:none;margin-top:9.1px;border-radius:50%;background:var(--line)}
.badge{width:29.9px;height:29.9px;flex:none;border-radius:9.1px;background:var(--bc);color:#fff;font-size:15.6px;display:inline-flex;align-items:center;justify-content:center}
.txt{min-width:0;flex:1}
.t{font-size:16.9px;font-weight:500;color:var(--text);word-break:break-word}
.note{font-size:15.6px;color:var(--muted);margin-top:2.6px}
.kids-count{font-size:14.3px;color:var(--muted);background:var(--surface2);border-radius:13px;padding:1.3px 9.1px;flex:none;margin-top:2.6px}
.collapsed>.node-head .kids-count{background:var(--accent-soft);color:var(--accent-deep)}
.children{margin:6.5px 0 0 11.7px;padding-left:31.2px;border-left:1.95px solid var(--line)}
.children>.node:before{content:"";position:absolute;left:-31.2px;top:19.5px;width:31.2px;border-top:1.95px solid var(--line)}
.branch>.children{border-left-color:var(--bl)}
.branch>.children>.node:before{border-top-color:var(--bl)}
.collapsed>.children{display:none}
.verse>.node-head{background:var(--amber-soft);border-left:3.9px solid var(--amber-line);border-radius:10.4px;padding:10.4px 14.3px}
.verse>.node-head .t{font-size:16.25px;font-weight:400;color:var(--text)}
.ref{display:inline-block;font-size:14.3px;font-weight:500;color:var(--amber-text);background:var(--surface);border:1.3px solid var(--amber-line);border-radius:6.5px;padding:0 7.8px;margin-right:9.1px;vertical-align:1.3px}
.call>.node-head{background:var(--amber-soft);border:1.3px solid var(--amber-line);border-radius:14.3px;padding:16.9px 20.8px}
.call>.node-head .t{font-size:18.85px;color:var(--amber-text)}
.call>.node-head:hover{filter:brightness(.98)}
.node-tools{display:none;align-items:center;gap:2.6px;margin-left:auto;flex:none;opacity:.5;transition:opacity .15s}
body.edit-mode .node-tools{display:inline-flex}
.node-head:hover .node-tools{opacity:1}
.nt{min-width:28.6px;height:27.3px;padding:0 5.2px;border:1.3px solid transparent;border-radius:6.5px;background:transparent;color:var(--muted);font-size:14.3px;line-height:1}
.nt:hover{background:var(--surface);border-color:var(--line);color:var(--accent-deep)}
.nt[data-act="del"]:hover{color:var(--danger);border-color:var(--danger)}
.editor{margin:7.8px 0 13px;padding:15.6px 18.2px;border:1.3px solid var(--accent);border-radius:13px;background:var(--surface);box-shadow:var(--shadow)}
.ed-row{display:flex;align-items:flex-start;gap:11.7px;margin-bottom:10.4px}
.ed-row label{width:98.8px;flex:none;font-size:15.6px;color:var(--muted);padding-top:6.5px}
.ed-row input,.ed-row textarea,.ed-row select{flex:1;min-width:0;border:1.3px solid var(--line);border-radius:9.1px;background:var(--bg);color:var(--text);padding:7.8px 11.7px;font-size:16.9px;outline:0}
.ed-row textarea{resize:vertical;line-height:1.5}
.ed-row input:focus,.ed-row textarea:focus,.ed-row select:focus{border-color:var(--accent)}
.ed-actions{display:flex;align-items:center;gap:9.1px;margin-top:5.2px}
.ed-actions .btn{height:37.7px}
.ed-actions .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.ed-actions .ok:hover{background:var(--accent-deep);color:#fff}
.ed-hint{font-size:14.3px;color:var(--muted);margin-left:auto}
.editing>.node-head{display:none}
mark{background:var(--amber-line);color:var(--text);border-radius:3.9px;padding:0 2.6px}
.node.match>.node-head{outline:1.95px solid var(--amber-line);outline-offset:1.3px}
.node.current>.node-head{outline:2.6px solid var(--amber);outline-offset:2.6px;background:var(--amber-soft)}
.float{position:fixed;right:28.6px;bottom:28.6px;display:flex;flex-direction:column;gap:10.4px;z-index:40}
.float button{width:49.4px;height:49.4px;border-radius:50%;border:1.3px solid var(--line);background:var(--surface);color:var(--text2);font-size:19.5px;box-shadow:var(--shadow)}
.float button:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:33.8px;transform:translateX(-50%);background:var(--accent-deep);color:#fff;padding:10.4px 20.8px;border-radius:26px;font-size:15.6px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:820px){
  .bar{padding:13px 18.2px 10.4px}.tools{margin-left:0;width:100%}.search-wrap input{width:143px}
  .editbar,.steps{padding-left:18.2px;padding-right:18.2px}main{padding:26px 18.2px 78px}
  .axis{margin-left:13px;padding-left:26px}.branch:before{left:-26px;width:26px}
  .children{padding-left:23.4px}.children>.node:before{left:-23.4px;width:23.4px}
  .ed-hint{display:none}.ed-row label{width:75.4px}
}
/* 折叠顶部工具栏 */
.top-toggle{flex:none}
body.top-collapsed .tools,body.top-collapsed .editbar,body.top-collapsed .steps,body.top-collapsed .stat{display:none}
body.top-collapsed .top-toggle{margin-left:auto}
/* 平铺阅读：移除全部连接线，改用缩进与层级色条 */
body.flat .axis{margin-left:0;padding-left:0;border-left:0}
body.flat .branch:before,body.flat .children>.node:before{display:none}
body.flat .children{margin-left:0;padding-left:20px;border-left:0}
body.flat .children>.node:not(.verse):not(.call)>.node-head{border-left:1.3px solid var(--bl,var(--line))}
body.flat .verse>.node-head,body.flat .call>.node-head{border-left-color:var(--amber-line)}
body.flat .ref{display:block;width:fit-content;margin:0 0 6px;white-space:nowrap}
body.flat .branch{margin-bottom:24px}
@media(max-width:820px){
  .bar{padding-top:9px}
  .stat{display:none}
  .top-toggle{margin-left:auto}
  .tools{margin-left:0;width:100%}
  .node-head{flex-wrap:wrap}
  .node-tools{flex-basis:100%;justify-content:flex-end;opacity:.8;margin-top:3px}
  .ed-row{flex-direction:column;gap:4px}
  .ed-row label{width:auto;padding-top:0}
  .float{right:12px;bottom:12px}
  .float button{width:36px;height:36px;opacity:.82}
  .steps{padding-bottom:12px;-webkit-overflow-scrolling:touch}
}
@media(max-width:820px){
  .top{max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .bar{padding:11.7px 18.2px 10.4px;gap:10.4px}
  .tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9.1px;width:100%;margin-left:0}
  .tools>.btn,.tools>.zoom-group{width:100%}
  .search-wrap{grid-column:1/-1;width:100%}
  .search-wrap input{flex:1;width:auto;min-width:0}
  .zoom-group{justify-content:space-between}
  #printBtn{grid-column:1/-1}
  .editbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9.1px;padding:10.4px 18.2px}
  .editbar .btn{width:100%}
  .editbar .edtag,.editbar .eddiv{display:none}
  #htmlBtn,#resetBtn{grid-column:1/-1}
  .save-state{grid-column:1/-1;margin-left:0;text-align:center}
  .steps{padding:0 18.2px 13px;scroll-snap-type:x proximity}
  .step{scroll-snap-align:start}
  .float{display:none}
}
@media print{
  .top,.float,.toast,.toggle,.kids-count,.editbar,.node-tools,.editor{display:none !important}
  .editing>.node-head{display:flex !important}
  body{background:#fff;color:#000}main{max-width:none;padding:0}.canvas{zoom:1 !important}
  .collapsed>.children{display:block !important}
  .node,.branch{break-inside:avoid;page-break-inside:avoid}.node-head:hover{background:transparent}
}
</style>

const CN=["一","二","三","四","五","六","七","八","九","十"];
const KEY="gm-data-"+DOC_ID;
const $=s=>document.querySelector(s);
const tree=$("#tree"),canvas=$("#canvas"),q=$("#q");
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>"n"+Math.random().toString(36).slice(2,9);
function validTree(d){return d&&typeof d==="object"&&typeof d.t==="string"&&(d.c===undefined||Array.isArray(d.c))&&(d.c||[]).every(validTree);}
function assignIds(d){(d.c||[]).forEach(x=>{if(!x._id)x._id=uid();assignIds(x);});}
function loadData(){try{const raw=localStorage.getItem(KEY);if(!raw)return null;const d=JSON.parse(raw);return validTree(d)?d:null;}catch(e){return null;}}
let DATA=loadData()||clone(ORIGINAL);
if(DATA.t==="福音内容")DATA.t="我的思维导图";
assignIds(DATA);
let undoStack=[],redoStack=[],collapsed=new Set();
let storageOK=true;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DATA));storageOK=true;}catch(e){storageOK=false;}
  const s=$("#saveState");s.textContent=storageOK?"已存本机浏览器 · 跨设备请另存 HTML":"本机存储不可用 · 请点「另存 HTML」";s.classList.toggle("bad",!storageOK);
}
function snapshot(){return JSON.stringify(DATA);}
function mutate(fn){
  undoStack.push(snapshot());if(undoStack.length>80)undoStack.shift();redoStack.length=0;
  fn();assignIds(DATA);save();render();updateHistory();
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(snapshot());DATA=JSON.parse(undoStack.pop());assignIds(DATA);save();render();updateHistory();toast("已撤销");
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(snapshot());DATA=JSON.parse(redoStack.pop());assignIds(DATA);save();render();updateHistory();toast("已重做");
}
function updateHistory(){$("#undoBtn").disabled=!undoStack.length;$("#redoBtn").disabled=!redoStack.length;}
function locate(id,list,parent){
  list=list||DATA.c;parent=parent||null;
  for(let i=0;i<list.length;i++){
    if(list[i]._id===id)return{d:list[i],list,i,parent};
    if(list[i].c){const r=locate(id,list[i].c,list[i]);if(r)return r;}
  }
  return null;
}
function newNode(){return{_id:uid(),t:"新要点",c:[]};}
function nodeTools(list){
  const wrap=document.createElement("span");wrap.className="node-tools";
  list.forEach(([act,label,title])=>{
    const b=document.createElement("button");b.className="nt";b.type="button";b.dataset.act=act;
    b.textContent=label;b.title=title;b.setAttribute("aria-label",title);wrap.appendChild(b);
  });
  return wrap;
}
const NODE_TOOLS=[["edit","✎","编辑内容"],["addChild","+子","添加子要点"],["addSibling","+同","在下方添加同级要点"],["up","↑","上移"],["down","↓","下移"],["del","×","删除"]];
function build(d,branchIdx){
  const isBranch=branchIdx!==null&&branchIdx!==undefined;
  const el=document.createElement("div");
  el.className="node"+(isBranch?" branch b"+((branchIdx%4)+1):"")+(d.verse?" verse":"")+(d.call?" call":"");
  el.dataset.id=d._id;
  const head=document.createElement("div");head.className="node-head";
  const has=d.c&&d.c.length;
  if(has){
    const tg=document.createElement("button");tg.className="toggle";tg.type="button";tg.textContent="−";tg.title="折叠 / 展开";head.appendChild(tg);
  }else{const dot=document.createElement("span");dot.className="leaf-dot";head.appendChild(dot);}
  if(isBranch){const b=document.createElement("span");b.className="badge";b.textContent=CN[branchIdx]||String(branchIdx+1);head.appendChild(b);}
  const txt=document.createElement("div");txt.className="txt";
  const t=document.createElement("div");t.className="t";
  if(d.verse&&d.s){const r=document.createElement("span");r.className="ref";r.textContent=d.s;t.appendChild(r);}
  t.appendChild(document.createTextNode(d.t));txt.appendChild(t);
  if(d.s&&!d.verse){const s=document.createElement("div");s.className="note";s.textContent=d.s;txt.appendChild(s);}
  head.appendChild(txt);
  if(has){const k=document.createElement("span");k.className="kids-count";k.textContent=d.c.length;head.appendChild(k);}
  head.appendChild(nodeTools(NODE_TOOLS));
  el.appendChild(head);
  if(has){const ch=document.createElement("div");ch.className="children";d.c.forEach(x=>ch.appendChild(build(x,null)));el.appendChild(ch);}
  return el;
}
function render(){
  clearEditor();
  tree.innerHTML="";
  const axis=document.createElement("div");axis.className="axis";
  DATA.c.forEach((d,i)=>axis.appendChild(build(d,i)));tree.appendChild(axis);
  tree.querySelectorAll(".node").forEach(n=>{if(collapsed.has(n.dataset.id))setCollapsed(n,true);});
  $("#stat").textContent="共 "+tree.querySelectorAll(".node").length+" 个要点";
  renderSteps();observeBranches();
  if(q.value.trim())runSearch(false);
  updateHistory();
}
function renderSteps(){
  const nav=$("#steps");nav.innerHTML="";
  DATA.c.forEach((d,i)=>{
    if(i){const sep=document.createElement("span");sep.className="sep";nav.appendChild(sep);}
    const btn=document.createElement("button");btn.className="step";btn.dataset.i=i;
    const ic=document.createElement("i");ic.textContent=CN[i]||String(i+1);btn.appendChild(ic);
    btn.appendChild(document.createTextNode(d.t.replace(/^[一二三四五六七八九十]+、\s*/,"")));
    btn.addEventListener("click",()=>goStep(i));nav.appendChild(btn);
  });
  setActive(0);
}
function setCollapsed(node,on){
  node.classList.toggle("collapsed",on);
  const tg=node.querySelector(":scope > .node-head > .toggle");
  if(tg){tg.textContent=on?"+":"−";tg.setAttribute("aria-expanded",String(!on));}
  const id=node.dataset.id;if(id){if(on)collapsed.add(id);else collapsed.delete(id);}
}
function expandAll(){tree.querySelectorAll(".node").forEach(n=>setCollapsed(n,false));}
function collapseAll(){tree.querySelectorAll(".node").forEach(n=>{if(n.querySelector(":scope > .children"))setCollapsed(n,true);});}
function openAncestors(el){let p=el.parentElement;while(p&&p!==tree){if(p.classList&&p.classList.contains("node"))setCollapsed(p,false);p=p.parentElement;}}
function goStep(i){
  const b=tree.querySelectorAll(".branch")[i];if(!b)return;
  setCollapsed(b,false);b.scrollIntoView({behavior:"smooth",block:"start"});setActive(i);
}
function setActive(i){document.querySelectorAll(".step").forEach((s,j)=>s.classList.toggle("active",j===i));}
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const i=[...tree.querySelectorAll(".branch")].indexOf(en.target);if(i>=0)setActive(i);}});},{rootMargin:"-200px 0px -62% 0px",threshold:0});
function observeBranches(){io.disconnect();tree.querySelectorAll(".branch").forEach(b=>io.observe(b));}

function clearEditor(){tree.querySelectorAll(".editor").forEach(e=>e.remove());tree.querySelectorAll(".editing").forEach(e=>e.classList.remove("editing"));}
function startEdit(el){
  if(!document.body.classList.contains("edit-mode"))return;
  const id=el.dataset.id,isRoot=id==="__root__";
  const loc=isRoot?null:locate(id);const d=isRoot?DATA:(loc&&loc.d);
  if(!d)return;
  clearEditor();el.classList.add("editing");
  const ed=document.createElement("div");ed.className="editor";
  ed.innerHTML='<div class="ed-row"><label>内容</label><textarea class="ed-t" rows="2"></textarea></div>'
    +'<div class="ed-row ed-extra"><label>备注 / 出处</label><input class="ed-s" type="text" placeholder="可选，例：以赛亚书53章"></div>'
    +'<div class="ed-row ed-extra"><label>显示样式</label><select class="ed-k"><option value="normal">普通要点</option><option value="verse">经文引用</option><option value="call">重点高亮</option></select></div>'
    +'<div class="ed-actions"><button class="btn ok" type="button">保存</button><button class="btn cancel" type="button">取消</button><span class="ed-hint">Ctrl+Enter 保存 · Esc 取消</span></div>';
  ed.querySelector(".ed-t").value=d.t;
  ed.querySelector(".ed-s").value=d.s||"";
  ed.querySelector(".ed-k").value=d.call?"call":(d.verse?"verse":"normal");
  if(isRoot)ed.querySelectorAll(".ed-extra").forEach(r=>r.style.display="none");
  el.insertBefore(ed,el.firstChild);
  const ta=ed.querySelector(".ed-t");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  ed.addEventListener("click",e=>{
    if(e.target.closest(".ok"))saveEditor(ed,el);
    else if(e.target.closest(".cancel"))clearEditor();
  });
  ed.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.stopPropagation();clearEditor();}
    else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveEditor(ed,el);}
  });
}
function saveEditor(ed,el){
  const id=el.dataset.id,isRoot=id==="__root__";
  const loc=isRoot?null:locate(id);const d=isRoot?DATA:(loc&&loc.d);
  if(!d){clearEditor();return;}
  const t=ed.querySelector(".ed-t").value.trim();
  if(!t){toast("内容不能为空");return;}
  const s=ed.querySelector(".ed-s").value.trim(),k=ed.querySelector(".ed-k").value;
  mutate(()=>{
    d.t=t;
    if(s)d.s=s;else delete d.s;
    if(k==="verse"){d.verse=true;delete d.call;}
    else if(k==="call"){d.call=true;delete d.verse;}
    else{delete d.verse;delete d.call;}
  });
  toast("已保存");
}
function focusEditor(id){
  const el=tree.querySelector('[data-id="'+id+'"]');
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});startEdit(el);}
}
function countDesc(d){let n=0;(d.c||[]).forEach(x=>{n+=1+countDesc(x);});return n;}
function handleAction(act,el){
  const id=el.dataset.id;
  if(id==="__root__"){
    if(act==="edit")startEdit(el);
    else if(act==="addChild"){const n=newNode();mutate(()=>{if(!DATA.c)DATA.c=[];DATA.c.push(n);});focusEditor(n._id);}
    else toast("主标题不能移动或删除");
    return;
  }
  const loc=locate(id);if(!loc)return;
  if(act==="edit"){startEdit(el);return;}
  if(act==="addChild"){
    const n=newNode();openAncestors(el);collapsed.delete(id);
    mutate(()=>{if(!loc.d.c)loc.d.c=[];loc.d.c.push(n);});
    focusEditor(n._id);return;
  }
  if(act==="addSibling"){
    const n=newNode();openAncestors(el);
    mutate(()=>{loc.list.splice(loc.i+1,0,n);});focusEditor(n._id);return;
  }
  if(act==="up"){
    if(loc.i===0){toast("已在最上方");return;}
    mutate(()=>{loc.list.splice(loc.i,1);loc.list.splice(loc.i-1,0,loc.d);});return;
  }
  if(act==="down"){
    if(loc.i===loc.list.length-1){toast("已在最下方");return;}
    mutate(()=>{loc.list.splice(loc.i,1);loc.list.splice(loc.i+1,0,loc.d);});return;
  }
  if(act==="del"){
    const sub=countDesc(loc.d);
    const msg=sub?"删除「"+loc.d.t.slice(0,18)+"」及其 "+sub+" 个子要点？":"删除「"+loc.d.t.slice(0,18)+"」？";
    if(!confirm(msg+"\n\n误删可用 Ctrl+Z 撤销。"))return;
    mutate(()=>{loc.list.splice(loc.i,1);});toast("已删除，可撤销");
  }
}
tree.addEventListener("click",e=>{
  const nt=e.target.closest(".nt");
  if(nt){const owner=nt.closest(".node, .root");if(owner)handleAction(nt.dataset.act,owner);return;}
  const tg=e.target.closest(".toggle");
  if(tg){const n=tg.closest(".node");if(n)setCollapsed(n,!n.classList.contains("collapsed"));return;}
});
tree.addEventListener("dblclick",e=>{
  const head=e.target.closest(".node-head");
  if(head&&head.parentElement.classList.contains("node"))startEdit(head.parentElement);
});
$("#expandAll").addEventListener("click",expandAll);
$("#collapseAll").addEventListener("click",collapseAll);
$("#undoBtn").addEventListener("click",undo);
$("#redoBtn").addEventListener("click",redo);
$("#addBranchBtn").addEventListener("click",()=>{const n=newNode();n.t="新主分支";mutate(()=>{if(!DATA.c)DATA.c=[];DATA.c.push(n);});focusEditor(n._id);});
$("#resetBtn").addEventListener("click",()=>{if(confirm("恢复为文件内置的原始内容？当前修改将被覆盖（可用 Ctrl+Z 撤销）。")){mutate(()=>{DATA=clone(ORIGINAL);});toast("已恢复原始内容");}});
$("#toTop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

function setEditMode(on){
  document.body.classList.toggle("edit-mode",on);
  const b=$("#editModeBtn");b.classList.toggle("on",on);b.textContent=on?"编辑中":"只读";
  if(!on)clearEditor();

let zoom=1;

const themeBtn=$("#themeBtn");

let toastTimer;
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800);}
function download(name,text,type){
  const blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
function outline(d,depth,out){
  if(depth===0)out.push("# "+d.t);
  else if(depth===1)out.push("\n## "+d.t);
  else{const pad="  ".repeat(Math.max(0,depth-2));out.push(pad+"- "+(d.verse?"["+(d.s||"经文")+"] ":"")+d.t+(d.s&&!d.verse?"（"+d.s+"）":""));}
  (d.c||[]).forEach(x=>outline(x,depth+1,out));
}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true;}catch(e){
    const ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(_){}
    ta.remove();return ok;
  }
}

let matches=[],mIdx=-1,timer;
function clearMarks(){
  tree.querySelectorAll("mark").forEach(m=>{const p=m.parentNode;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();});
  tree.querySelectorAll(".node").forEach(n=>n.classList.remove("match","current"));
}
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function runSearch(doJump){
  clearMarks();const term=q.value.trim(),count=$("#count");
  if(!term){matches=[];mIdx=-1;count.textContent="";count.classList.remove("zero");return;}
  const re=new RegExp(escapeRe(term),"gi");
  const walker=document.createTreeWalker(tree,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;
    if(p&&p.closest(".node-tools,.kids-count,.badge,.editor,.ed-hint"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }}),texts=[];
  while(walker.nextNode())texts.push(walker.currentNode);
  texts.forEach(n=>{
    const s=n.textContent;if(!re.test(s))return;re.lastIndex=0;
    const frag=document.createDocumentFragment();let last=0,m;
    while((m=re.exec(s))){
      frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const mk=document.createElement("mark");mk.textContent=m[0];frag.appendChild(mk);
      last=m.index+m[0].length;if(!m[0].length)re.lastIndex++;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));n.parentNode.replaceChild(frag,n);
  });
  const marks=[...tree.querySelectorAll("mark")];
  marks.forEach(m=>{const n=m.closest(".node");if(n){n.classList.add("match");openAncestors(n);}});
  matches=[...tree.querySelectorAll(".node.match")];mIdx=-1;
  count.textContent=marks.length+" 处";count.classList.toggle("zero",marks.length===0);
  if(doJump!==false&&matches.length)jump(1);
}
function jump(dir){
  if(!matches.length)return;
  if(mIdx>=0)matches[mIdx].classList.remove("current");
  mIdx=(mIdx+dir+matches.length)%matches.length;
  const el=matches[mIdx];el.classList.add("current");
  const head=el.querySelector(":scope > .node-head");if(head)head.scrollIntoView({behavior:"smooth",block:"center"});
  $("#count").textContent=(mIdx+1)+" / "+matches.length;
}
q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>runSearch(true),120);});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();jump(e.shiftKey?-1:1);}});
$("#next").addEventListener("click",()=>jump(1));
$("#prev").addEventListener("click",()=>jump(-1));

document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable){
    if(e.key==="Escape"){if(tag==="input"&&e.target===q){q.value="";runSearch(false);q.blur();}}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return;}
  if(e.key==="/"){e.preventDefault();q.focus();q.select();}
  else if(e.key==="e"||e.key==="E")expandAll();
  else if(e.key==="c"||e.key==="C")collapseAll();
  else if(e.key==="Escape"){clearEditor();q.value="";runSearch(false);}
  else if(e.key==="+"||e.key==="=")setZoom(zoom+.1);
  else if(e.key==="-")setZoom(zoom-.1);
});

window.addEventListener(`resize`,syncTopHeight);
function syncTopHeight(){const t=document.querySelector(`.top`);if(t)document.documentElement.style.setProperty(`--topH`,t.getBoundingClientRect().height+`px`);}
let flatOn=true;
function applyFlat(){
  document.body.classList.toggle("flat",flatOn);
  const b=$("#flatBtn");b.classList.toggle("on",flatOn);
  b.title=flatOn?"当前：平铺阅读，已隐藏连接线":"当前：树状视图";
}
function setTopCollapsed(on){
  document.body.classList.toggle("top-collapsed",on);
  const b=$("#topToggle");b.textContent=on?"工具栏":"收起";
  b.setAttribute("aria-expanded",String(!on));
  syncTopHeight();
}
$("#topToggle").addEventListener("click",()=>setTopCollapsed(!document.body.classList.contains("top-collapsed")));

  flatOn=!flatOn;applyFlat();toast(flatOn?"平铺阅读：已隐藏连接线":"树状视图：显示连接线");
});
